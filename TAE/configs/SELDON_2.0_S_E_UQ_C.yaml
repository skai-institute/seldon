dataset:
  name: LightCurveDataLoader
  config:
    #lightcurve_path: /projects/ncsa/caps/skai/data/YSE_DR1.parquet
    lightcurve_path: /projects/ncsa/caps/skai/data/ELAsTiCC/complete.parquet
    fine_tune_data: null
    class_filter: 
      - 'SNIa'        
      - 'SNII'
      - 'SNIIb'
      - 'SNIIn'
      - 'SNIb/c'
      - 'SNIax'
      - 'SN91bg'
    #  - 'SLSN'
    #  - 'KN'
    #  - 'CART'
    #  - 'ILOT'
    #  - 'PISN'
    flux_normalization: minmax
    time_normalization: std
    min_points: 11
    max_points: 64
    max_length: 405
    augmentations: 
      - FullSample
      - CutOffSample
      - BandSample
      - CutOnSample
      #- SparseSample
    batch_size: 2048
    num_workers: 8
    mode: parquet
    #test_run: False
    t_max: "infer"
    resample: True
    include_non_detections: True
    include_meta_data: True
    t_offset: 0.0
    group_classes: True
    zero_non_detections: False
    pin_memory: True
    force_zero_non_detections: False
    #min_obs_fraction: 0.0

model_params:
  name: SELDON
  config:
    latent_dim: 12
    variational: True
    scale_sigma_by_number: False
    uq_net:
      name: ResNet # Partial objects are detected by the encoder and have their dims set appropriately
      config:
        ninp: 46 # 12 + 64 + 1 + 1 # latent_dim + decoder BAND_EMB_DIM + flux + time
        noutp: 1 # Again, same as embedder.output_dim, dims are ignored for Partial types
        nhid: 256 # Again, same as embedder.output_dim, dims are ignored for Partial types
        nlayers: 1
        activation: GELU
        dropout: 0.01
        norm: True
        bias: True

    encoder:
      name: RecurrentODEEncoderV2
      config:
        embedder:
          name: LightCurveEmbedding
          config:
            input_dim: 1
            output_dim: 256
            band_emb_dim: 6
            embed_flux_error: True
            embed_meta_data: True
            embed_time: False
            dropout: 0.01
            scale_embedding_grad_by_freq: False
            activation: GELU
        rnn:
          name: Partial # Partial objects are detected by the encoder and have their dims set appropriately
          config:
            model_class: 
              name: RNNODEEncoder
              config: null
            hidden_size: 256 # should be embedder.output_dim, dims are ignored for Partial types
            bias: True 
            dt: 0.0001
            batch_first: True 
            dropout: 0.01
            nlayers: 1
            norm: True
            activation: GELU
            atol: 1.0
            rtol: 1.0 
            pcoeff: 0.2 
            icoeff: 0.5 
            dcoeff: 0.0 
            dt_max: 0.005 
            dt_min: 0.0
            use_fixed_solver: True
            use_hyper_integrator: False
            use_class_token: True
            fixed_solver_steps: 1
        aggregator: null
        #  name: Partial # Partial objects are detected by the encoder and have their dims set appropriately
        #  config:
        #    model_class: 
        #      name: SimpleDeepSet
        #      config: null
        #    input_dim: 257 # should be embedder.output_dim + 1, dims are ignored for Partial types
        #    hidden_dim: 256 # should be embedder.output_dim, dims are ignored for Partial types
        #    activation: GELU
        #    dropout: 0.0
        #    pooling: attentive
        #    norm: True
        #    n_layers: 2
        output_network:
          name: Partial # Partial objects are detected by the encoder and have their dims set appropriately
          config:
            model_class: 
              name: ResNet
              config: null
            ninp: 256 # Again, same as embedder.output_dim, dims are ignored for Partial types
            noutp: 256 # Again, same as embedder.output_dim, dims are ignored for Partial types
            nhid: 256 # Again, same as embedder.output_dim, dims are ignored for Partial types
            nlayers: 1
            activation: GELU
            dropout: 0.01
            norm: True
            bias: True

        t_max: 1.0
        N_points: 50
        autoscale_input_time: True
        autoscale_output_time: False

    decoder: 
      name: SpectrumBasisDecoder
      config:
        latent_dim: 12
        hidden: 256
        BAND_EMB_DIM: 32
        num_basis: 4
        dropout: 0.01
        band_dropout: 0.1
        activation: GELU
        nlayers: 2
        logscale_output: True # This with autoscale_outputs can let the model learn in the original domain of the data
        norm: True
        norm_first: True
        rescale_decoupled_network: True

exp_params:
  name: SELDONEnergyClassifierExperiment
  config:
    kl_weight: 0.1
    group_latent_by_class: False
    weight_bands: True 
    weight_classes: True 
    inverse_transform: True
    tune_parameters: False
    energy_weight: 0.1
    direct_partition: True
    blocked_gibbs_plus_langevin: True
    scale_delta_by: "detection_flag"
    inverse_scale_reconstruction: False # For 1-1 this would be true, but we want decoded predictions in log space
    loss: 
      name: FlexibleGaussianLoss
      config:
        eps: 1e-6
        #delta: 5.0
    params:
      dataset: LightCurveDataLoader
      figures: []
      optimizer: 
        name: "Adam"
        config:
          LR: 3e-4
          weight_decay: 1e-5 #2e-5 #2e-5 #0.0 #2e-5 #0.0 #5e-6 #2.0e-04 #0.0 #2e-5 #0.0 #5e-5 #2e-3 #$0.0 #2e-5 #1e-4 #1e-5 #1e-5 #1 #1 #1e-5
          encoder_scale_factor: 1.0
          reduce_on_plateau: False
    metrics: 
      name: Metrics
      config:
        metrics:
          - fractional_errors
          - z_scores
          #- nrmse
    # dataset will be filled by the fill_config function

trainer_params:
  max_epochs: 3000
  accelerator: "auto"
  devices: "auto"
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1
  num_nodes: 1
  strategy: "ddp_find_unused_parameters_true"
  log_every_n_steps: 50
  #resume_from_checkpoint: "/scratch/jackob/logs/BandAwareDeepSetGRUODEVAE_512_128_128/version_5/checkpoints/epoch=65-val_loss=1.01.ckpt"
  #num_sanity_val_steps: 4
  #detect_anomaly: True

logging_params:
  manual_seed: 42
  save_dir: "/projects/ncsa/caps/skai/software/Transient-Foundation-Model/logs/"
  name: "SELON_2.0"
