model_params:
  name: SELDONEnergyClassifier
  config:
    latent_dim: ${global_params.latent_dim}
    variational: True
    scale_sigma_by_number: False
    num_classes: 11
    uq_net:
      name: ResidualNetwork # Partial objects are detected by the encoder and have their dims set appropriately
      config:
        n_features: ${sum:[${global_params.sed_size}, ${global_params.latent_dim}, ${model_params.config.num_classes}, 2]}
        n_output: 1 
        n_hidden: ${global_params.ode_size} # Again, same as embedder.output_dim, dims are ignored for Partial types
        n_layers: 1
        activation: GELU
        dropout: *dropout
        norm: True

    encoder:
      name: RecurrentODEEncoderV2
      config:
        embedder:
          name: LightCurveEmbedding
          config:
            input_dim: 1
            output_dim: ${global_params.hidden_size}
            band_emb_dim: *sed_size
            embed_flux_error: True
            embed_meta_data: True
            embed_time: False
            dropout: *dropout
            scale_embedding_grad_by_freq: False
            activation: GELU
            band_embedding_files: *transmission_filters
            norm: True
        rnn:
          name: RNNODEEncoderV2 # Partial objects are detected by the encoder and have their dims set appropriately
          config:
            use_class_token: False
            rnn_ode_cell:
              name: RNNODECell
              config:
                rnn_cell:
                  name: LNGRUCell
                  config:
                    input_size: ${model_params.config.encoder.config.embedder.config.output_dim}
                    hidden_size: ${global_params.hidden_size}
                ode_solver:
                  name: ODESolver
                  config:
                    use_fixed_solver: True
                    fixed_solver_steps: 1
                    ode_net:
                      name: ODEModelWrapper
                      config:
                        autonomous: True
                        model:
                          name: ResidualNetwork
                          config:
                            n_features: ${global_params.hidden_size}
                            n_output: ${global_params.hidden_size}
                            n_hidden: ${global_params.ode_size}
                            n_layers: 2
                            dropout: *dropout
                            activation: GELU
                            n_heads: 1
                            norm: True
                            residual_input: False

        aggregator: null
        output_network: null
        #  name: ResidualNetwork # Partial objects are detected by the encoder and have their dims set appropriately
        #  config:
        #    n_features: ${global_params.hidden_size} # Again, same as embedder.output_dim, dims are ignored for Partial types
        #    n_output: ${global_params.hidden_size} # Again, same as embedder.output_dim, dims are ignored for Partial types
        #    n_hidden: ${global_params.ode_size} # Again, same as embedder.output_dim, dims are ignored for Partial types
        #    n_layers: 2
        #    activation: GELU
        #    dropout: *dropout
        #    norm: True
        #    norm_first: True
        #    residual_input: True

        t_max: 1.0
        N_points: 50
        autoscale_input_time: False
        autoscale_output_time: False

    decoder: 
      name: SpectrumBasisDecoder
      config:
        latent_dim: ${sum:[${global_params.latent_dim}, ${model_params.config.num_classes}]}
        hidden: 256
        BAND_EMB_DIM: *sed_size
        num_basis: 2
        dropout: *dropout
        band_dropout: 0.0 #625 # (1 - 2*NUM_BANDS/BAND_EMB_DIM), on average each band gets 2 samples
        activation: GELU
        nlayers: 2
        parameter_n_layers: 2
        residual_parameter_input: True
        logscale_output: True # This with autoscale_outputs can let the model learn in the original domain of the data
        norm: True
        norm_first: True
        rescale_decoupled_network: True
        full_spectrum: False
        weight_bases: False # Right now, the weights act on too much of the latent vector
        separable: True
        norm_params: True
        log_amp_center: 0.0
        double_sigmoid: False
        scale_band_embedding: False
        softmax_time_evolution: False
        sine_transform: True
        use_logspace: False
        norm_band_embedding: False
        band_embedding_files: *transmission_filters
        embedding_expansion: 2
        time_impulse_first: False
        embed_freqs: False
        use_modular_basis: True

exp_params:
  name: SELDONEnergyClassifierExperiment2
  config:
    kl_weight: 0.0 #0.01875 #0.00625 # Using beta-vae weight = 0.1 * latent / hidden
    group_latent_by_class: False
    weight_bands: True 
    weight_classes: True
    inverse_transform: True
    tune_parameters: False
    energy_weight:  0.01 #1e-2 # 0.1 * (hidden + num_classes) * 4 / hidden
    direct_partition: True
    blocked_gibbs_plus_langevin: True
    scale_delta_by: "detection_flag"
    inverse_scale_reconstruction: False # For 1-1 this would be true, but we want decoded predictions in log space
    energy_on: True
    energy_resnet: True
    true_redshift_rate: 0.01
    fit_redshift: True
    energy_norm: 0.1 #1e-2
    temperature: 1.0 #0.07
    successive_z_loss: False
    loss: 
      name: FlexibleGaussianLoss
      config:
        eps: 1e-6
        #delta: 5.0
    params:
      dataset: LightCurveDataLoader
      figures: []
      optimizer: 
        name: "Adam"
        config:
          LR: 3e-4 # #0.088 #0.088 #3e-3 # 1/sqrt(hidden)
          weight_decay: 0.0 #1e-5 #2e-5 #1e-5 #1e-5 # 0.1/hidden^2 #2e-5 #2e-5 #0.0 #2e-5 #0.0 #5e-6 #2.0e-04 #0.0 #2e-5 #0.0 #5e-5 #2e-3 #$0.0 #2e-5 #1e-4 #1e-5 #1e-5 #1 #1 #1e-5
          scheduler:
            name: CosineAnnealingScheduler
            config:
              T_max: 200000
              eta_min: 1e-8
          #scheduler:
          #  name: SquareRootWarmupScheduler
          #  config:
          #    num_warmups: 4000
    metrics: 
      name: Metrics
      config:
        metrics:
          - fractional_errors
          - z_scores
          #- nrmse
    # dataset will be filled by the fill_config function

trainer_params:
  max_epochs: 2000
  accelerator: "auto"
  devices: "auto"
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
