dataset:
  name: LightCurveDataLoader
  config:
    lightcurve_path: /projects/ncsa/caps/skai/data/ELAsTiCC/complete.parquet
    class_filter: 
      - 'SNIa'        
      - 'SNII'
      - 'SNIIb'
      - 'SNIIn'
      - 'SNIb/c'
      - 'SNIax'
      - 'SN91bg'
      - 'SLSN'
      - 'KN'
      - 'CART'
      - 'TDE'
      - 'PISN'
      - 'Dwarf Novae'
      - 'ILOT'
      - 'M-dwarf Flare'
      #- 'EB'
      #- 'AGN'
      #- 'uLens'
      #- 'RR Lyrae'
      #- 'Delta Scuti'
      #- 'Cepheid'
    flux_normalization: minmax
    time_normalization: std
    min_points: 7
    max_points: 256
    augmentations: 
      - FullSample
      - CutOffSample
      - BandSample
      - SparseSample
      - CutOnSample
    batch_size: 1024
    num_workers: 16
    mode: parquet
    #test_run: False
    t_max: "infer"
    resample: True
    include_non_detections: True
    include_meta_data: True
    t_offset: -1.0
    group_classes: False
    zero_non_detections: True
    pin_memory: True
    #min_obs_fraction: 0.0

model_params:
  name: BandAwareAutoencoder
  config:
    latent_dim: 5
    variational: True
    kl_weight: 1e-4
    loss: 
      name: MaskedHuberLoss
      config:
        weight_bands: True 
        weight_classes: True 
        inverse_transform: True
        delta: 5.0
        scale_delta_by: "detection_flag"
        scale_recon: True # Default: True, False is useful with logscale_output in the decoder and inverse_transform=True, breaks plotting
    is_adversarial: False
    adv_epsilon: 0.0005
    adv_alpha: 0.8
    encoder:
      name: "RecurrentODEEncoder"
      config:
        input_dim: 2
        hidden_dim: 64
        dropout: 0.1 #0.01
        nlayers: 2
        BAND_EMB_DIM: 6
        pooling: "sum"
        norm: True
        activation_ode: GELU
        activation_deepsets: GELU
        aggregate_with_deepsets: True
        embed_flux_error: True
        embed_meta_data: True
        bias: True
        t_max: 1.0
        N_points: 1
        use_hyper_integrator: False
        atol: 1.0 
        rtol: 1.0 
        pcoeff: 0.2 # For the PID controller, we have Proportional Term
        icoeff: 0.5 # Integral Term
        dcoeff: 0.0 # derivative term, (0, 1, 0) is the basic integral controller
        dt_max: 0.5 
        dt_min: 0.0
        use_fixed_solver: True
    decoder: 
      name: "SigmoidBasisDecoder"
      config:
        latent_dim: 5
        hidden: 64
        BAND_EMB_DIM: 18
        num_basis: 18
        dropout: 0.1 #0.01
        activation: GELU
        decoupled: True
        nlayers: 2
        decouple_dim: 
          - 1
          - 1
        band_dot_prod: True
        logscale_output: False # This with autoscale_outputs can let the model learn in the original domain of the data
        suppress_higher_terms: False
        norm: True
        rescale_decoupled_network: True
        sed_mode: True # Treat the set of basis functions as an SED where the band embedding is a softmax filter
        accumulate: False
        include_redshift: True # Apply a mock redshift-like correction to the time and amplitudes
        tanhshrink_centroids: False # Use a tanhshrink on the t0's rather than mean-centering
        autoscale_outputs: False # This makes the network capable of learning a scale factor for the inverse transform

exp_params:
  name: GRUVAEExperiment
  config:
    params:
      dataset: SNDataModuleParquet
      figures: []
      optimizer: 
        name: "Adam"
        config:
          LR: 3e-4
          weight_decay: 0.0 #2e-5 #2e-5 #0.0 #2e-5 #0.0 #5e-6 #2.0e-04 #0.0 #2e-5 #0.0 #5e-5 #2e-3 #$0.0 #2e-5 #1e-4 #1e-5 #1e-5 #1 #1 #1e-5
          encoder_scale_factor: 1.0
          reduce_on_plateau: True
    metrics: 
      name: Metrics
      config:
        metrics:
          - fractional_errors
          - z_scores
          #- nrmse
    # dataset will be filled by the fill_config function

trainer_params:
  max_epochs: 3000
  accelerator: "auto"
  devices: "auto"
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1
  num_nodes: 1
  strategy: "ddp"
  log_every_n_steps: 50
  #resume_from_checkpoint: "/scratch/jackob/logs/BandAwareDeepSetGRUODEVAE_512_128_128/version_5/checkpoints/epoch=65-val_loss=1.01.ckpt"
  #num_sanity_val_steps: 4
  #detect_anomaly: True

logging_params:
  manual_seed: 42
  save_dir: "/projects/ncsa/caps/skai/software/Transient-Foundation-Model/logs/"
  name: "BandAwareGRUODEVAE"
