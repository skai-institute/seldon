dataset:
  name: SNDataModule
  config:
    lightcurve_path: TAE/data/cleaned_data_merged.pkl  
    class_filter: 
      - 'SNIa'        
      - 'SNII'     
      - 'SNIb/c'
      - 'SNIax'
      - 'SN91bg'  
    flux_normalization: max_partial_scalar
    time_normalization: minmax
    min_points: 2
    augmentation: cutoff
    num_aug_per_curve: 1
    batch_size: 1024
    num_workers: 2
    test_run: False
    t_max: "infer"
    resample: True
    min_obs_fraction: 0.0

   


model_params:
  name: BandAwareAutoencoder
  config:
    latent_dim: 64
    variational: False
    kl_weight: 0.001
    loss: "Huber"
    is_adversarial: True
    adv_alpha: 0.5
    adv_epsilon: 0.0005
    #num_bands: 6
    #band_embedding_dim: 4
    encoder:
      name: "EquivariantDeepSetEncoder"
      config:
        input_dim: 4
        hidden_dim: 128
        pooling: "sum"
        activation: "PReLU"
        dropout: 0.2
        num_layers: 2
    decoder: 
      name: "SigmoidBasisDecoder"
      config:
        latent_dim: 64
        hidden: 128
        BAND_EMB_DIM: 0
        num_basis: 8
        dropout: 0.0
        activation: "GELU"
        decoupled: True
        decouple_dim: 16



exp_params:
  name: GRUVAEExperiment
  config:
    params:
      dataset: SNDataModule
      figures: []
      optimizer: 
        name: "Adam"
        config:
          LR: 1e-3
          weight_decay: 1e-4 #1e-5
    metrics: 
      name: Metrics
      config:
        metrics:
          - fractional_errors
          - z_scores
          #- nrmse
    # dataset will be filled by the fill_config function

trainer_params:
  max_epochs: 2000
  accelerator: "auto"
  devices: 1
  gradient_clip_val: 3.0

logging_params:
  manual_seed: 42
  save_dir: "/scratch/jackob/logs/"
  name: "BandAwareEQDeepSetVAE"
