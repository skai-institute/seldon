###############################################################################
#  Baseline GRU-masked auto-encoder (no KD) – sees the same cut-off curves
###############################################################################

dataset:
  name: SNDataModule
  config:
    lightcurve_path: TAE/data/cleaned_data_merged.pkl
    class_filter: ['SNIa']
    flux_normalization: max_partial_scalar
    time_normalization: minmax
    min_points: 10          # use same value you ended up with
    augmentation: cutoff
    min_obs_fraction: 0.8   # same curriculum start
    num_aug_per_curve: 4
    batch_size: 2046
    num_workers: 4
    test_run: false
    t_max: infer

model_params:
  name: student_gru_masked          # reuse the same class
  config:
    teacher_ckpt: null              # <–– turn teacher off
    lambda_kd: 0.0                  # <–– KD weight 0
    latent_dim: 64
    variational: false
    kl_weight: 0.001
    loss: Huber
    encoder:
      name: GRUMaskedEncoder
      config: {input_dim: 3, hidden_dim: 128}
    decoder:
      name: SigmoidBasisDecoder
      config: {latent_dim: 64, hidden: 256, BAND_EMB_DIM: 0, num_basis: 8}

exp_params:
  name: GRUVAEExperiment
  config:
    params:
      dataset: SNDataModule
      optimizer: {name: Adam, config: {LR: 1e-3, weight_decay: 1e-4}}
    metrics:
      name: Metrics
      config: {metrics: [fractional_errors, z_scores]}

trainer_params:
  max_epochs: 600
  accelerator: auto
  devices: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 10

logging_params:
  manual_seed: 42
  save_dir: /scratch/jiezhong/logs/
  name: StudentKD_GRUmask
