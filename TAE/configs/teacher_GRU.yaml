# light_curve_autoencoder_teacher.yaml
# ---------------------------------------------------------------
dataset:
  name: SNDataModule
  config:
    lightcurve_path: TAE/data/cleaned_data_merged.pkl
    # lightcurve_path: /projects/ncsa/caps/skai/data/cleaned_data_8_previous_nondetects_zeroed_merged.pkl
    class_filter:
      - 'SNIa'
    flux_normalization: max_partial_scalar
    time_normalization: minmax
    min_points: 2
    augmentation: full          #  teacher sees the **entire** curve
    min_obs_fraction: 1.0       #  guarantee every point is observed
    num_aug_per_curve: 1        #  no artificial cut-offs
    batch_size: 2048
    num_workers: 4
    test_run: False
    t_max: "infer"

# ---------------------------------------------------------------
model_params:
  name: BandAwareAutoencoder
  config:
    latent_dim: 64
    variational: False
    kl_weight: 0.001
    loss: "Huber"
    encoder:
      name: "GRUMaskedEncoder"
      config:
        input_dim: 3              # [flux, time, mask/band]
        hidden_dim: 128
    decoder:
      name: "SigmoidBasisDecoder"
      config:
        latent_dim: 64
        hidden: 256
        BAND_EMB_DIM: 0
        num_basis: 8

# ---------------------------------------------------------------
exp_params:
  name: GRUVAEExperiment
  config:
    params:
      dataset: SNDataModule
      figures: []
      optimizer:
        name: "Adam"
        config:
          LR: 1e-3
          weight_decay: 1e-4
    metrics:
      name: Metrics
      config:
        metrics:
          - fractional_errors
          - z_scores
          # - nrmse  # enable if you like

# ---------------------------------------------------------------
trainer_params:
  max_epochs: 600               # teacher converges quickly on full curves
  accelerator: "auto"
  devices: 1
  gradient_clip_val: 1.0
  fast_dev_run: false 

# ---------------------------------------------------------------
logging_params:
  manual_seed: 42
  save_dir: "/scratch/jiezhong/logs/"
  name: "TeacherFull_GRUMask"
