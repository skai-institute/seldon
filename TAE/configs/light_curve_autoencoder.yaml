dataset:
  name: SNDataModule
  config:
    #lightcurve_path: TAE/data/cleaned_data_merged.pkl  
    lightcurve_path: /u/jackob/skai/data/cleaned_data_8_previous_nondetects_zeroed_merged.pkl  
    class_filter: 
      - 'SNIa'        
    #  - 'SNII'     
    #  - 'SNIb/c'
    #  - 'SNIax'
    #  - 'SN91bg'  
    flux_normalization: minmax
    time_normalization: minmax
    min_points: 15
    augmentation: cutoff
    num_aug_per_curve: 1
    batch_size: 1024
    num_workers: 2
    test_run: False
    t_max: "infer"
    resample: False
    min_obs_fraction: 0.0

model_params:
  name: BandAwareAutoencoder
  config:
    latent_dim: 100
    variational: False
    kl_weight: 0.01
    loss: "Huber"
    is_adversarial: True
    adv_alpha: 0.8
    adv_epsilon: 0.00005
    encoder:
      name: "DeepSetEncoder"
      config:
        input_dim: 100
        hidden_dim: 256
        pooling: "sum"
        activation: "PReLU"
        dropout: 0.0
    decoder: 
      name: "GaussianBasisDecoder"
      config:
        latent_dim: 100
        hidden: 256
        BAND_EMB_DIM: 12
        num_basis: 32
        dropout: 0.5
        activation: "GELU"
        decoupled: True
        decouple_dim: 
          - 20
          - 20
        band_dot_prod: True

exp_params:
  name: GRUVAEExperiment
  config:
    params:
      dataset: SNDataModule
      figures: []
      optimizer: 
        name: "Adam"
        config:
          LR: 1e-4
          weight_decay: 0.0 #2e-5 # 0.0 #2e-5 #1e-5
    metrics: 
      name: Metrics
      config:
        metrics:
          - fractional_errors
          - z_scores
          #- nrmse
    # dataset will be filled by the fill_config function

trainer_params:
  max_epochs: 2000
  accelerator: "auto"
  devices: 1
  gradient_clip_val: 0.1

logging_params:
  manual_seed: 42
  save_dir: "/scratch/jackob/logs/"
  name: "BandAwareDeepSetVAE"
