name: tae
channels:
  - conda-forge
  - http://ssb.stsci.edu/astroconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy
  - seaborn
  - scipy
  - astropy
  - scikit-learn
  - matplotlib
  - pyarrow
  - fastparquet
  - tensorboard
  - pip:
    - torch
    - torchvision
    - torchaudio
    - lightning
    - umap
    - omegaconf
    - lightning-bolts
    - h5py
    - hydra-core
    - requests
    - torch_optimizer

