name: tae
channels:
  - conda-forge
  - http://ssb.stsci.edu/astroconda
dependencies:
  - python=3.12
  - pytorch-gpu
  - pytorch=2.7.1
  - lightning=2.5.2
  # lightning=2.5.2 pulls pytorch-lightning as an unbounded transitive dep;
  # without >=2 the solver can pick 1.x which uses the removed np.Inf and
  # rejects modern LR schedulers.
  - pytorch-lightning>=2
  - cuda-compiler
  - hydra-core
  - omegaconf
  - seaborn
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - pyarrow
  - tensorboard
  - h5py
  - pip
  - pip:
    - umap-learn
    - torch_optimizer
    - git+https://github.com/martenlienen/torchode
    - torchdiffeq
    - safetensors
