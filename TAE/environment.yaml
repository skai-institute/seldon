name: tae
channels:
  - conda-forge
  - http://ssb.stsci.edu/astroconda
dependencies:
  - python=3.9
  - pip
  - numpy
  - seaborn
  - scipy
  - astropy
  - scikit-learn
  - matplotlib
  - pyarrow
  - fastparquet
  - tensorboard
  - pip:
    # use ONLY the PyTorch CUDA 12.6 index while installing torch*
    - '--index-url=https://download.pytorch.org/whl/cu126'

    - torch
    - torchvision
    - torchaudio

    # back to normal PyPI for everything else
    - '--index-url=https://pypi.org/simple'
    - lightning
    - umap
    - omegaconf
    - lightning-bolts
    - h5py
    - hydra-core
    - requests
    - torch_optimizer
    - git+https://github.com/martenlienen/torchode
    - torchdiffeq
    - safetensors
