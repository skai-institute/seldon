name: Run Pytest (Conda)

on:
  pull_request:
    branches: [ main, fine_parameter_control ]

env:
  # This is necessary to use the latest version of Node.js in the GitHub Actions runner.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Strip GPU-only pins for the CPU-only runner
        # TAE/environment.yaml pins pytorch-gpu + cuda-compiler, which only
        # solve when an NVIDIA driver provides the __cuda virtual package.
        # Hosted runners have no GPU, so the solve fails before any test runs
        # (every CI run since the env overhaul died here). Drop those two
        # lines from the runner's copy of the file; the solver then picks the
        # CPU build of the same pytorch=2.7.1. Production installs from the
        # unmodified file are unaffected.
        run: sed -i '/pytorch-gpu/d;/cuda-compiler/d' TAE/environment.yaml

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"
          # The following line is the name of the environment that will be created
          # in the conda environment using the environment.yml file. The environment
          # will be automatically activated in the following steps.
          activate-environment: tae
          environment-file: TAE/environment.yaml
          # Do not activate the base conda environment.
          auto-activate: false
          # Remove the implicit 'defaults' channel since explicit channels are
          # specified in the environment.yaml file.
          conda-remove-defaults: true

      - name: Install pytest (if not in environment.yaml)
        # Since GitHub Actions runs each step in a new shell, we need to use bash -l {0}
        # to run commands in the same shell as the conda environment was activated.
        # So do not remove the line below or similar lines in subsequent steps.
        shell: bash -l {0}
        run: conda install pytest

      - name: Run tests
        shell: bash -l {0}
        run: pytest -v